<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImpactMat — Listening Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --border:#2a323d;
    --fg:#e6edf3; --muted:#8b98a8; --accent:#7c9cff; --accent2:#5ad1c4;
    --good:#3fb950; --warn:#d29922; --bad:#f85149; --shadow:0 8px 30px rgba(0,0,0,.35);
    --radius:14px;
  }
  :root[data-theme="light"]{
    --bg:#f6f8fb; --panel:#ffffff; --panel2:#eef2f7; --border:#dce3ec;
    --fg:#131820; --muted:#5b6675; --accent:#3a5bd9; --accent2:#0fa89a;
    --shadow:0 8px 30px rgba(20,40,80,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:780px;margin:0 auto;padding:28px 20px 90px}
  h1{font-size:1.5rem;margin:.2em 0 .3em;letter-spacing:-.01em}
  h2{font-size:1.06rem;margin:1.4em 0 .5em}
  .muted{color:var(--muted)}
  .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{font-weight:700;letter-spacing:-.01em}
  .tools{display:flex;gap:8px}
  .chipbtn{border:1px solid var(--border);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.82rem}
  .progress{position:relative;height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:14px 0 4px}
  .progress > i{position:absolute;left:0;top:0;height:100%;width:0;transition:width .3s;border-radius:999px}
  #barMax{background:color-mix(in srgb,var(--accent) 28%,transparent)}   /* furthest reached (faint) */
  #bar{background:linear-gradient(90deg,var(--accent),var(--accent2))}    /* current position (solid) */
  .steplabel{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow)}
  .papertitle{font-size:.92rem;color:var(--fg);font-weight:600;line-height:1.5}
  .venue{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-weight:700}
  .field{margin:14px 0}
  .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
  input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--fg);font:inherit}
  ul.rules{margin:.4em 0;padding-left:1.15em}
  ul.rules li{margin:.4em 0;color:var(--muted)}
  .callout{border:1px solid var(--border);border-left:4px solid var(--accent2);background:var(--panel2);
    border-radius:10px;padding:13px 15px;margin:14px 0;font-size:.92rem}
  .callout b{color:var(--fg)}
  .consent{font-size:.83rem;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;margin-top:16px}
  .pill{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent2);font-weight:700;border:1px solid var(--border);border-radius:999px;padding:3px 10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 20px}
  @media(max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;background:var(--panel2)}
  .opt .lab{font-weight:700;font-size:1.05rem;margin-bottom:4px}
  .opt .played{font-size:.72rem;color:var(--muted)}
  .opt .played.ok{color:var(--good)}
  .play{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;margin-top:12px}
  .play.playing{background:var(--accent2)}
  .play svg{width:15px;height:15px;fill:currentColor}
  .qtext{text-align:center;font-weight:600;margin:2px 0 14px}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .choice{border:2px solid var(--border);border-radius:12px;padding:16px 10px;text-align:center;
    cursor:pointer;transition:border-color .15s,background .15s;font-weight:600}
  .choice small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;margin-top:4px}
  .choice:hover{border-color:var(--accent)}
  .choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
  .choice.sim.sel{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
  .choice.dif.sel{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
  .btn{border:none;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:.8rem;color:var(--muted)}
  [hidden]{display:none!important}
  .center{text-align:center}
  .big{font-size:2.4rem;margin:.2em 0}
  code{font-family:"JetBrains Mono",monospace;background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:.85em}
  .famgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:16px 0}
  .famcard{border:1px solid var(--border);border-radius:12px;background:var(--panel2);padding:12px;text-align:center}
  .famcard model-viewer{width:100%;height:130px;background:transparent;--poster-color:transparent}
  .famcard .m{font-weight:700;margin:8px 0 6px}
  .famcard .plays{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .famcard .pbtn{border:1px solid var(--border);background:var(--panel);color:var(--fg);border-radius:8px;
    padding:6px 9px;font:inherit;font-size:.78rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .famcard .pbtn.playing{background:var(--accent2);color:#fff;border-color:transparent}
  .famcard .pbtn svg{width:10px;height:10px;fill:currentColor}
  table.stats{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
  table.stats th,table.stats td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:center}
  table.stats th{color:var(--muted);font-weight:600;font-size:.78rem}
  table.stats td.grp{text-align:left;font-weight:600}
  table.stats td .sub{color:var(--muted);font-weight:400;font-size:.76rem}
  table.stats tr.foilrow{background:color-mix(in srgb,var(--warn) 8%,transparent)}
  .oktag{display:inline-block;font-size:.68rem;color:var(--good);border:1px solid var(--good);
    border-radius:999px;padding:0 6px;margin-left:4px;font-weight:600}
  .barmini{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;display:flex;margin-top:5px}
  .barmini > i{height:100%}
  .b-sim{background:var(--good)} .b-tie{background:var(--warn)} .b-dif{background:var(--bad)}
  .note{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.55}
  .statsblock h2{margin:1.1em 0 .2em}
  .resetlink{font-size:.75rem;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="grad">ImpactMat</span> · <span data-t="brand">Listening Study</span></div>
    <div class="tools">
      <button class="chipbtn" id="langBtn">KO / EN</button>
      <button class="chipbtn" id="themeBtn">◐</button>
    </div>
  </div>

  <!-- ============ INTRO ============ -->
  <section id="intro" class="card">
    <div class="venue" data-t="venue"></div>
    <div class="papertitle">ImpactMat: Continuous Material Estimation from Impact Sounds for Inverse Sound Rendering</div>
    <h1 style="margin-top:14px" data-t="introTitle"></h1>
    <p class="muted" data-t="introLead"></p>

    <h2 data-t="procHead"></h2>
    <ul class="rules">
      <li data-t="proc1"></li>
      <li data-t="proc2"></li>
      <li data-t="proc3"></li>
    </ul>
    <div class="callout" data-t="criterion"></div>

    <div class="field">
      <label for="pid" data-t="nameLabel"></label>
      <input type="text" id="pid" autocomplete="off">
      <div class="hint" style="margin-top:5px" data-t="nameHint"></div>
    </div>
    <div class="field">
      <label for="env" data-t="envLabel"></label>
      <select id="env">
        <option value="" data-t="envChoose"></option>
        <option value="headphone" data-t="envHead"></option>
        <option value="earphone" data-t="envEar"></option>
        <option value="speaker" data-t="envSpk"></option>
      </select>
    </div>

    <p class="consent" id="consentBlock"></p>

    <div class="actions">
      <span class="hint" id="startHint"></span>
      <button class="btn primary" id="startBtn" disabled data-t="startBtn"></button>
    </div>
  </section>

  <!-- ============ ALREADY PARTICIPATED ============ -->
  <section id="blocked" class="card center" hidden>
    <div class="big">✓</div>
    <h1 data-t="blockedTitle"></h1>
    <p class="muted" data-t="blockedBody"></p>
    <button class="resetlink" id="resetLink"></button>
  </section>

  <!-- ============ FAMILIARIZATION ============ -->
  <section id="familiarize" class="card" hidden>
    <div class="pill" data-t="famPill"></div>
    <h1 data-t="famTitle"></h1>
    <p class="muted" data-t="famLead"></p>
    <div class="famgrid" id="famGrid"></div>
    <div class="actions">
      <button class="btn ghost" id="famBack" data-t="backBtn"></button>
      <span class="hint" data-t="famHint" style="flex:1;text-align:center"></span>
      <button class="btn primary" id="famStart" data-t="famStart"></button>
    </div>
  </section>

  <!-- ============ SECTION INTRO ============ -->
  <section id="section" class="card" hidden>
    <div class="pill" id="secPill"></div>
    <h1 id="secTitle"></h1>
    <p class="muted" id="secDesc"></p>
    <div class="callout" id="secGuide"></div>
    <div class="actions">
      <button class="btn ghost" id="secBack" data-t="backBtn"></button>
      <span class="hint" id="secCount" style="flex:1;text-align:center"></span>
      <button class="btn primary" id="secStart" data-t="secStart"></button>
    </div>
  </section>

  <!-- ============ TRIAL ============ -->
  <section id="trial" class="card" hidden>
    <div class="steplabel"><span id="stepText"></span><span id="domText" class="pill"></span></div>
    <div class="progress"><i id="barMax"></i><i id="bar"></i></div>
    <div class="opts">
      <div class="opt">
        <div class="lab" data-t="soundA"></div>
        <div class="played" id="playedA"></div>
        <button class="play" id="playA"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span data-t="playA"></span></button>
      </div>
      <div class="opt">
        <div class="lab" data-t="soundB"></div>
        <div class="played" id="playedB"></div>
        <button class="play" id="playB"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span data-t="playB"></span></button>
      </div>
    </div>
    <div class="qtext" data-t="question"></div>
    <div class="choices">
      <div class="choice sim" data-v="similar"><span data-t="cSim"></span><small data-t="cSimS"></small></div>
      <div class="choice" data-v="tie"><span data-t="cTie"></span><small data-t="cTieS"></small></div>
      <div class="choice dif" data-v="different"><span data-t="cDif"></span><small data-t="cDifS"></small></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="trialBack" data-t="backBtn"></button>
      <span class="hint" id="hint" style="flex:1;text-align:center"></span>
      <button class="btn primary" id="nextBtn" disabled data-t="nextBtn"></button>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <section id="done" class="card" hidden>
    <div class="center"><div class="big">🎧</div><h1 data-t="doneTitle"></h1>
    <p class="muted" id="doneMsg"></p></div>
    <div id="stats"></div>
    <div class="center" style="margin-top:18px">
      <button class="btn primary" id="dlBtn" data-t="dlBtn"></button>
    </div>
  </section>

</div>

<script type="module" src="../assets/js/model-viewer.min.js"></script>

    proc1:"Each trial presents two sounds (A, B). Please listen to both at least once.",
    proc2:"Judge how similar the two sounds are in <b>material character (timbre, damping, attack)</b> and choose <b>Similar / Unsure / Different</b>.",
    proc3:"Presentation order is randomized and the source (original) is not indicated.",
    criterion:"⚑ <b>Judgement criterion</b> — Ignore absolute pitch differences and judge whether the two sounds are perceived as striking the <b>same material</b>. If the material character is similar despite a pitch offset, please answer <b>“Similar”</b>.",
    nameLabel:"Full name (legal name)",
    nameHint:"Used only to prevent duplicate participation and to verify data; anonymized in analysis. Please enter your name exactly as on your ID.",
    envLabel:"Listening device", envChoose:"Select…", envHead:"Headphones", envEar:"Earphones", envSpk:"Speakers",
    startBtn:"Start →", startHintNeed:"Please enter your name and listening device.",
    consent:(a)=>`This listening experiment is conducted for <b>academic research</b>. Participation is entirely voluntary and may be stopped at any time. Responses are collected <b>anonymously</b>, used only for statistical analysis, and for no other purpose.<br><br>${a}`,
    authors:"<b>Authors</b>: Hyebin Cho<sup>1,*</sup>, Bumsoo Kim<sup>2,*</sup>, Joon Son Chung<sup>1</sup><br><sup>1</sup>KAIST &nbsp; <sup>2</sup>Chung-Ang University &nbsp;·&nbsp; <sup>*</sup>equal contribution",
    blockedTitle:"You have already participated", blockedBody:"A completed response already exists in this browser. Thank you for your participation.",
    reset:"(researcher) reset this device’s participation record",
    dupBlock:"A response has already been submitted under this name. Only one response per person is allowed.",
    famPill:"Familiarization", famTitle:"Learn each material’s impact sound",
    famLead:"A representative object (3D) and example impact sounds for each material. The examples are different strikes of the same object. Please listen to build a sense of “this material sounds like this” before you begin.",
    famHint:"We recommend listening to each material once.", famStart:"Got it, start →", ex:"Ex.",
    backBtn:"← Back", checking:"Checking…",
    secStart:"Start this section →", sectionOf:(i,n)=>`Section ${i} / ${n}`, secCount:(n)=>`${n} trials`,
    stepText:(si,sn,i,n)=>`Section ${si}/${sn} · Trial ${i} / ${n}`,
    soundA:"Sound A", soundB:"Sound B", playA:"Play A", playB:"Play B",
    notPlayed:"not played", playedOk:"played",
    question:"Are the two sounds similar in material? <span class='muted' style='font-weight:400'>(ignore pitch)</span>",
    cSim:"Similar", cSimS:"same material", cTie:"Unsure", cTieS:"hard to tell", cDif:"Different", cDifS:"different material",
    hintNeedPlay:"You must listen to both A and B.", hintNeedChoice:"Please choose Similar / Unsure / Different.", hintReady:"Selected — continue.",
    nextBtn:"Next →", doneTitle:"Your responses are complete. Thank you.",
    dlBtn:"Save responses (JSON)",
    savedGas:"Your responses were submitted successfully. Thank you.", savedLocal:"Responses saved as a JSON file. Please send it to the researcher.",
    saveErr:"An error occurred while submitting. Please do not refresh and notify the researcher.",
    statsHead:"Your response summary",
    thGroup:"Condition", thSim:"Similar", thTie:"Unsure", thDif:"Different",
    expSim:"expect Similar", expDif:"expect Different",
    noteMeas:"<b>rerender</b>: the material-similarity measure (higher Similar = better material reproduction).",
    noteAnchor:"<b>Control conditions</b> — identical/gtvar should be Similar; foil should be <b>Different</b>. Foils intentionally pair <b>different objects and materials</b>, so a Different response is correct, not an error. Green marks the expected direction.",
    noteSanity:(a,b)=>`Response reliability: ${a}${a&&b?" · ":""}${b}`,
  }
};
let lang = (navigator.language||"en").toLowerCase().startsWith("ko") ? "ko" : "en";
const t = k => (T[lang][k] ?? T.en[k] ?? k);

/* section + condition labels (per language) */
function sectionInfo(dom){
  const ko = {
    synthetic:{label:"섹션: 합성음 (Synthetic)",
      desc:"물리 시뮬레이션으로 합성한 타격음과, 그로부터 추정한 재질 파라미터로 재렌더링한 소리를 비교합니다.",
      guide:"이 섹션의 두 소리는 대체로 매우 유사합니다. 그럼에도 피치 차이보다 재질 특성을 기준으로 판단해 주십시오."},
    real:{label:"섹션: 실제 녹음 (Real)",
      desc:"실제 물체를 두드려 녹음한 소리와, 추정된 재질로 재렌더링한 소리를 비교합니다.",
      guide:"실제 녹음이므로 음높이(피치)가 다를 수 있습니다. <b>음높이 차이는 무시</b>하고 <b>재질 특성이 유사하면 “유사함”</b>으로 판단하십시오. 합성음 섹션과는 <b>기준을 분리</b>하여 이 섹션 안에서 상대적으로 평가해 주십시오."}
  };
  const en = {
    synthetic:{label:"Section: Synthetic",
      desc:"Compare a physically-simulated impact sound with a re-rendering from the estimated material parameters.",
      guide:"The two sounds here are generally very similar. Still, judge by material character rather than pitch."},
    real:{label:"Section: Real recordings",
      desc:"Compare a real recorded impact with a re-rendering from the estimated material.",
      guide:"These are real recordings, so pitch may differ. <b>Ignore pitch</b> and answer <b>“Similar” when the material character matches</b>. Keep this section’s criterion separate from the synthetic one and judge relatively within this section."}
  };
  return (lang==="ko"?ko:en)[dom] || {label:dom,desc:"",guide:""};
}
// [label, sub, expected]
function grpLabel(k){
  const ko={
    "synthetic/rerender":["synthetic · rerender","입력 vs 재렌더 (측정)",null],
    "synthetic/identical":["synthetic · identical ↑","동일 소리 2회 (상한, 정답=유사함)","sim"],
    "synthetic/foil":["synthetic · foil ↓","다른 물체·다른 재질 (대비, 정답=다름)","dif"],
    "real/rerender":["real · rerender","입력 vs 재렌더 (측정)",null],
    "real/gtvar":["real · gtvar","동일 물체·다른 녹음 (GT 천장)","sim"],
    "real/foil":["real · foil ↓","다른 물체·다른 재질 (대비, 정답=다름)","dif"],
  };
  const en={
    "synthetic/rerender":["synthetic · rerender","input vs re-render (measure)",null],
    "synthetic/identical":["synthetic · identical ↑","same clip twice (upper bound, expect Similar)","sim"],
    "synthetic/foil":["synthetic · foil ↓","different object & material (contrast, expect Different)","dif"],
    "real/rerender":["real · rerender","input vs re-render (measure)",null],
    "real/gtvar":["real · gtvar","same object, different take (GT ceiling)","sim"],
    "real/foil":["real · foil ↓","different object & material (contrast, expect Different)","dif"],
  };
  return (lang==="ko"?ko:en)[k] || [k,"",null];
}
const DOMLABEL={synthetic:"SYNTHETIC", real:"REAL"};

/* ============================ STATE ============================ */
const $ = s => document.querySelector(s);
let byDomain={}, sectionOrder=[], secIdx=0, list=[], idx=0, FAM=[];
let responses=[], session={}, order=null, choice=null, played={A:false,B:false};
let totalDone=0, totalN=0, maxReached=0;
function updateBar(){
  $("#bar").style.width=(totalN?totalDone/totalN*100:0)+"%";
  $("#barMax").style.width=(totalN?Math.max(maxReached,totalDone)/totalN*100:0)+"%";
}
const audio = new Audio(), famAudio = new Audio();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

/* apply static translations */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = t(el.getAttribute("data-t")); });
  $("#consentBlock").innerHTML = t("consent")(t("authors"));
  $("#resetLink").textContent = t("reset");
  $("#pid").placeholder = lang==="ko" ? "예: 홍길동" : "e.g., Jane Doe";
  checkStart();
}
function updateTrialTexts(){
  if(!list.length) return;
  $("#stepText").textContent=t("stepText")(secIdx+1,sectionOrder.length,idx+1,list.length);
  $("#playedA").textContent = played.A ? t("playedOk") : t("notPlayed");
  $("#playedB").textContent = played.B ? t("playedOk") : t("notPlayed");
  gate();
}
function refreshDynamic(){
  if(!$("#familiarize").hidden) renderFamiliarize();
  if(!$("#section").hidden) showSection();
  if(!$("#trial").hidden) updateTrialTexts();
  if(!$("#done").hidden) $("#stats").innerHTML=renderStats(responses);
}
$("#langBtn").onclick=()=>{ lang = lang==="ko"?"en":"ko"; applyLang(); refreshDynamic(); };
$("#themeBtn").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";};

function checkStart(){
  const ok = $("#pid").value.trim().length>=2 && $("#env").value;
  $("#startBtn").disabled=!ok;
  $("#startHint").textContent = ok ? "" : t("startHintNeed");
}
$("#pid").oninput=checkStart; $("#env").onchange=checkStart;

/* ============================ LOAD ============================ */
async function loadTrials(){
  let all=[];
  try{ all = await (await fetch(CONFIG.JSON_URL)).json(); }catch(e){ alert("trials.json load failed: "+e); }
  try{ FAM = await (await fetch(CONFIG.FAM_URL)).json(); }catch(e){ FAM=[]; }
  byDomain={}; all.forEach(x=>{(byDomain[x.domain]=byDomain[x.domain]||[]).push(x);});
  if(CONFIG.SHUFFLE_TRIALS) Object.values(byDomain).forEach(shuffle);
  sectionOrder=Object.keys(byDomain).sort().reverse();          // synthetic, real
  if(CONFIG.RANDOMIZE_SECTION_ORDER && sectionOrder.length>1 && Math.random()<.5) sectionOrder.reverse();
  totalN=all.length;
  applyLang();
  // per-browser completion block
  try{ if(localStorage.getItem(CONFIG.LS_KEY)){ $("#intro").hidden=true; $("#blocked").hidden=false; } }catch(e){}
}
$("#resetLink").onclick=()=>{ try{localStorage.removeItem(CONFIG.LS_KEY);}catch(e){} location.reload(); };

/* JSONP duplicate pre-check against GAS (optional) */
function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="__imcb"+Date.now(); const s=document.createElement("script");
    const to=setTimeout(()=>{cleanup();rej("timeout");},6000);
    function cleanup(){clearTimeout(to);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();res(d);};
    s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;
    s.onerror=()=>{cleanup();rej("error");};
    document.body.appendChild(s);
  });
}

/* ============================ FLOW ============================ */
$("#startBtn").onclick=async ()=>{
  const name=$("#pid").value.trim();
  // loading state (prevents double-click while the duplicate check runs)
  $("#startBtn").disabled=true; $("#startBtn").textContent=t("checking");
  if(CONFIG.GAS_URL){
    try{
      const r=await jsonp(`${CONFIG.GAS_URL}?action=check&name=${encodeURIComponent(name.toLowerCase())}`);
      if(r && r.used){ alert(t("dupBlock")); $("#startBtn").disabled=false; $("#startBtn").textContent=t("startBtn"); return; }
    }catch(e){ /* network issue -> allow, localStorage still guards */ }
  }
  $("#startBtn").textContent=t("startBtn");
  session={pid:name, env:$("#env").value, lang, ua:navigator.userAgent,
           started:new Date().toISOString(), n_trials:totalN, section_order:sectionOrder.slice()};
  $("#intro").hidden=true; secIdx=0;
  if(FAM && FAM.length){ renderFamiliarize(); $("#familiarize").hidden=false; } else showSection();
};

/* back navigation (only where safe; not on intro/done/blocked) */
$("#famBack").onclick=()=>{ famAudio.pause(); $("#familiarize").hidden=true; $("#startBtn").disabled=false; $("#startBtn").textContent=t("startBtn"); $("#intro").hidden=false; };
$("#secBack").onclick=()=>{
  if(secIdx>0) return;                       // shown only for the first section anyway
  $("#section").hidden=true;
  if(FAM && FAM.length){ renderFamiliarize(); $("#familiarize").hidden=false; }
  else { $("#startBtn").disabled=false; $("#startBtn").textContent=t("startBtn"); $("#intro").hidden=false; }
};
$("#trialBack").onclick=()=>{
  audio.pause();
  if(idx>0){ idx--; totalDone--; const saved=responses.pop(); renderTrial(saved); }   // restore prior answer
  else { $("#trial").hidden=true; showSection(); }                    // first trial -> section intro
};

const PLAYSVG='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
function renderFamiliarize(){
  const g=$("#famGrid"); g.innerHTML="";
  FAM.forEach(card=>{
    const el=document.createElement("div"); el.className="famcard";
    const mv=`<model-viewer src="../${card.glb}" camera-controls disable-zoom auto-rotate
      auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none"
      shadow-intensity="0.6" exposure="1.0" loading="eager"></model-viewer>`;
    const plays=card.audios.map((a,i)=>`<button class="pbtn" data-src="../${a}">${PLAYSVG}${t("ex")} ${i+1}</button>`).join("");
    el.innerHTML=`${mv}<div class="m">${card.material}</div><div class="plays">${plays}</div>`;
    g.appendChild(el);
  });
  g.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{
    famAudio.pause(); famAudio.src=b.dataset.src; famAudio.currentTime=0; famAudio.play();
    g.querySelectorAll(".pbtn").forEach(x=>x.classList.remove("playing"));
    b.classList.add("playing"); famAudio.onended=()=>b.classList.remove("playing");
  });
}
$("#famStart").onclick=()=>{ famAudio.pause(); $("#familiarize").hidden=true; secIdx=0; showSection(); };

function showSection(){
  const dom=sectionOrder[secIdx], info=sectionInfo(dom);
  $("#secPill").textContent=t("sectionOf")(secIdx+1,sectionOrder.length);
  $("#secTitle").textContent=info.label; $("#secDesc").textContent=info.desc;
  $("#secGuide").innerHTML="⚑ "+info.guide;
  $("#secCount").textContent=t("secCount")(byDomain[dom].length);
  $("#secBack").hidden = secIdx!==0;         // back only from the first section
  $("#trial").hidden=true; $("#section").hidden=false;
}
$("#secStart").onclick=()=>{ list=byDomain[sectionOrder[secIdx]]; idx=0; $("#section").hidden=true; $("#trial").hidden=false; renderTrial(); };

function renderTrial(saved){
  const tr=list[idx];
  audio.pause();
  if(saved){                                   // going back: restore prior A/B order, plays, choice
    order={A:saved.clip_A, B:saved.clip_B}; played={A:true,B:true}; choice=saved.choice;
  } else {
    order = Math.random()<.5 ? {A:"a",B:"b"} : {A:"b",B:"a"}; played={A:false,B:false}; choice=null;
  }
  $("#stepText").textContent=t("stepText")(secIdx+1,sectionOrder.length,idx+1,list.length);
  $("#domText").textContent=DOMLABEL[tr.domain]||tr.domain;
  updateBar();
  $("#playedA").textContent = played.A ? t("playedOk") : t("notPlayed"); $("#playedA").classList.toggle("ok", played.A);
  $("#playedB").textContent = played.B ? t("playedOk") : t("notPlayed"); $("#playedB").classList.toggle("ok", played.B);
  document.querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel", !!choice && c.dataset.v===choice));
  gate();
}
function urlFor(side){const tr=list[idx];return "../"+tr[order[side]];}
function play(side,btn){
  audio.pause(); audio.src=urlFor(side); audio.currentTime=0; audio.play();
  document.querySelectorAll(".play").forEach(b=>b.classList.remove("playing"));
  btn.classList.add("playing"); audio.onended=()=>btn.classList.remove("playing");
}
$("#playA").onclick=e=>{play("A",e.currentTarget);played.A=true;$("#playedA").textContent=t("playedOk");$("#playedA").classList.add("ok");gate();};
$("#playB").onclick=e=>{play("B",e.currentTarget);played.B=true;$("#playedB").textContent=t("playedOk");$("#playedB").classList.add("ok");gate();};
document.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{
  choice=c.dataset.v; document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); gate();
});
function gate(){
  const both=played.A&&played.B;
  $("#nextBtn").disabled=!(both&&choice);
  $("#hint").textContent = !both ? t("hintNeedPlay") : !choice ? t("hintNeedChoice") : t("hintReady");
}
$("#nextBtn").onclick=()=>{
  const tr=list[idx];
  responses.push({trial_id:tr.id, domain:tr.domain, pair_type:tr.pair_type, section_index:secIdx,
                  clip_A:order.A, clip_B:order.B, choice, meta:tr.meta||{}, t:new Date().toISOString()});
  idx++; totalDone++; maxReached=Math.max(maxReached,totalDone);
  if(idx<list.length) renderTrial(); else { secIdx++; if(secIdx<sectionOrder.length) showSection(); else finish(); }
};

/* ============================ STATS + SAVE ============================ */
function renderStats(res){
  const g={};
  res.forEach(r=>{const k=r.domain+"/"+r.pair_type;(g[k]=g[k]||{similar:0,tie:0,different:0})[r.choice]++;});
  const order=["synthetic/rerender","synthetic/identical","synthetic/foil","real/rerender","real/gtvar","real/foil"];
  let rows="";
  order.forEach(k=>{
    if(!g[k])return;
    const c=g[k], n=c.similar+c.tie+c.different, pc=x=>n?Math.round(x/n*100):0;
    const [lab,sub,exp]=grpLabel(k); const isFoil=k.endsWith("/foil");
    const mark=w=> exp===w?' style="font-weight:700;color:var(--good)"':'';
    const okTag = exp!=null ? `<span class="oktag">${exp==="sim"?t("expSim"):t("expDif")} · ${exp==="sim"?pc(c.similar):pc(c.different)}%</span>`:'';
    rows+=`<tr${isFoil?' class="foilrow"':''}>
      <td class="grp">${lab}<div class="sub">${sub} ${okTag}</div></td>
      <td${mark("sim")}>${c.similar} <span class="sub">${pc(c.similar)}%</span></td>
      <td>${c.tie} <span class="sub">${pc(c.tie)}%</span></td>
      <td${mark("dif")}>${c.different} <span class="sub">${pc(c.different)}%</span></td>
      <td style="min-width:88px"><div class="barmini">
        <i class="b-sim" style="width:${pc(c.similar)}%"></i>
        <i class="b-tie" style="width:${pc(c.tie)}%"></i>
        <i class="b-dif" style="width:${pc(c.different)}%"></i></div></td></tr>`;
  });
  const ic=g["synthetic/identical"], icn=ic?ic.similar+ic.tie+ic.different:0;
  const fo=["synthetic/foil","real/foil"].reduce((o,k)=>{const c=g[k];if(c){o.d+=c.different;o.n+=c.similar+c.tie+c.different;}return o;},{d:0,n:0});
  const sane = ic ? (lang==="ko"?`동일-소리 ${ic.similar}/${icn} 유사함`:`identical ${ic.similar}/${icn} Similar`) : "";
  const foChk = fo.n ? (lang==="ko"?`대비(foil) ${fo.d}/${fo.n} 다름`:`foil ${fo.d}/${fo.n} Different`) : "";
  return `<div class="statsblock"><h2>${t("statsHead")}</h2>
    <table class="stats">
      <tr><th style="text-align:left">${t("thGroup")}</th><th>${t("thSim")}</th><th>${t("thTie")}</th><th>${t("thDif")}</th><th></th></tr>
      ${rows}
    </table>
    <div class="note">• ${t("noteMeas")}<br>• ${t("noteAnchor")}<br>• ${t("noteSanity")(sane,foChk)}</div></div>`;
}
function download(payload){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`impactmat_study_${(session.pid||"anon").replace(/\s+/g,"_")}_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
let PAYLOAD=null;
async function finish(){
  audio.pause(); $("#trial").hidden=true; $("#section").hidden=true; $("#done").hidden=false;
  maxReached=totalN; totalDone=totalN; updateBar();
  PAYLOAD={session, responses, finished:new Date().toISOString(), n:responses.length,
           tally:responses.reduce((o,r)=>{const k=r.domain+"/"+r.pair_type+"/"+r.choice;o[k]=(o[k]||0)+1;return o;},{})};
  console.log("STUDY RESULT",PAYLOAD);
  $("#stats").innerHTML=renderStats(responses);
  try{ localStorage.setItem(CONFIG.LS_KEY, new Date().toISOString()); }catch(e){}
  if(CONFIG.GAS_URL){
    try{
      await fetch(CONFIG.GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(PAYLOAD)});
      $("#doneMsg").textContent=t("savedGas");
    }catch(e){ console.error(e); download(PAYLOAD); $("#doneMsg").textContent=t("saveErr"); }
  } else { download(PAYLOAD); $("#doneMsg").textContent=t("savedLocal"); }
}
$("#dlBtn").onclick=()=>{ if(PAYLOAD) download(PAYLOAD); };

loadTrials();
</script>
</body>
</html>
